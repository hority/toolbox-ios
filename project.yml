name: Toolbox
options:
  minimumXcodeGenVersion: 2.42.0
  developmentLanguage: ja
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: YES
    SWIFT_EMIT_LOC_STRINGS: NO
targets:
  Toolbox:
    type: application
    platform: iOS
    sources:
      - path: Toolbox
      - path: Shared/AttendanceQR
    dependencies:
      - target: ToolboxWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hority.toolbox
        PRODUCT_NAME: Toolbox
        PROVISIONING_PROFILE_SPECIFIER: "$(TOOLBOX_APP_PROFILE)"
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_CFBundleDisplayName: 工具箱
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
  ToolboxWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: ToolboxWidgets
      - path: Shared/AttendanceQR
    info:
      path: ToolboxWidgets/Info.plist
      properties:
        CFBundleDisplayName: 工具箱QR
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hority.toolbox.widgets
        PRODUCT_NAME: ToolboxWidgets
        PROVISIONING_PROFILE_SPECIFIER: "$(TOOLBOX_WIDGET_PROFILE)"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) TOOLBOX_WIDGET_EXTENSION"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        SUPPORTS_MACCATALYST: NO
  ToolboxTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Toolbox
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hority.toolbox.tests
schemes:
  Toolbox:
    build:
      targets:
        Toolbox: all
        ToolboxTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: ToolboxTests
      gatherCoverageData: true
      coverageTargets:
        - Toolbox
    archive:
      config: Release
    management:
      shared: true
      isShown: true
