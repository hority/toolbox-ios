name: Simulator tests (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install project generator
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Show toolchain
        run: xcodebuild -version
      - name: Unit tests
        run: bash ci/test.sh
      - name: Save test and build diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: toolbox-diagnostics-${{ github.run_number }}
          path: |
            build/*.log
            build/*.xcresult
          if-no-files-found: ignore
          retention-days: 7
