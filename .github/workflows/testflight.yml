name: Upload to TestFlight (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: toolbox-testflight
  cancel-in-progress: false
jobs:
  upload:
    if: github.repository == 'hority/toolbox-ios' && github.ref == 'refs/heads/master'
    environment: testflight
    runs-on: macos-26
    timeout-minutes: 40
    env:
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      APP_STORE_CONNECT_KEY_ID: ${{ vars.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ vars.APP_STORE_CONNECT_ISSUER_ID }}
      MATCH_GIT_URL: ${{ vars.MATCH_GIT_URL }}
      MATCH_GIT_BRANCH: signing
      FASTLANE_SKIP_UPDATE_CHECK: '1'
      FASTLANE_OPT_OUT_USAGE: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install project generator
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1
        with:
          bundler-cache: true
      - name: Validate and prepare temporary credentials
        run: bash ci/prepare-signing.sh
        env:
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          SIGNING_GIT_TOKEN: ${{ secrets.SIGNING_GIT_TOKEN }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      - name: Generate project
        run: xcodegen generate
      - name: Verify synthetic shortcut archive and button contrast
        run: bash ci/verify-shortcut-fixture.sh
      - name: Build and upload
        run: bundle exec fastlane ios beta
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      - name: Remove temporary signing files
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/toolbox-asc.p8"
          rm -rf build
